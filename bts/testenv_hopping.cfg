[testsuite]
program=BTS_Tests
config=BTS_Tests_FH.cfg
copy=BTS_Tests.cfg
clean=rename_junit_xml_classname.sh ":hopping"

[bsc]
prepare=osmo-config-merge osmo-bsc.cfg osmo-bsc-fh.confmerge > osmo-bsc-fh.cfg
program=osmo-bsc -c osmo-bsc-fh.cfg
make=osmo-bsc
package=osmo-bsc libosmocore-utils
copy=osmo-bsc.cfg osmo-bsc-fh.confmerge

[trx-proxy]
prepare=require_ulimit_r.sh 32
program=osmo-trx-proxy
make=osmo-trx
package=no
copy=osmo-trx-proxy.cfg

[trxcon]
program=trxcon
make=trxcon
package=no

[bts]
prepare=require_ulimit_r.sh 30
program=respawn.sh osmo-bts-trx
make=osmo-bts
package=osmo-bts
copy=osmo-bts.cfg
vty_port=4241
