[testsuite]
program=BTS_Tests
config=BTS_Tests.cfg

[bsc]
program=osmo-bsc
make=osmo-bsc
package=osmo-bsc
copy=osmo-bsc.cfg

[trx-proxy]
prepare=require_ulimit_r.sh 32
program=osmo-trx-proxy
make=osmo-trx
package=no
copy=osmo-trx-proxy.cfg

[trxcon]
program=trxcon
make=trxcon
package=no

[bts]
prepare=require_ulimit_r.sh 30
program=respawn.sh osmo-bts-trx
make=osmo-bts
package=osmo-bts
copy=osmo-bts.cfg
vty_port=4241
