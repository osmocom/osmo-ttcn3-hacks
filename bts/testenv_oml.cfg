[testsuite]
program=BTS_Tests
config=BTS_Tests_OML.cfg

[trx-proxy]
prepare=require_ulimit_r.sh 32
program=osmo-trx-proxy
make=osmo-trx
package=osmo-trx-proxy
copy=osmo-trx-proxy.cfg
# TODO: Remove *_latest after osmo-trx >= 1.9.0 was released
program_latest=run_fake_trx.sh
make_latest=.make.osmocom-bb.clone
package_latest=osmocom-bb-trx-toolkit

[trxcon]
program=trxcon
make=trxcon
package=osmocom-bb-trxcon

[bts]
prepare=osmo-config-merge osmo-bts.cfg osmo-bts-oml.confmerge > osmo-bts-oml.cfg && require_ulimit_r.sh 30
program=osmo-bts-trx -c osmo-bts-oml.cfg
make=osmo-bts
package=osmo-bts-trx libosmocore-utils
copy=osmo-bts.cfg osmo-bts-oml.confmerge
vty_port=4241
