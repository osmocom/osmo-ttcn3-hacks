[testsuite]
program=UDM_Tests
config=UDM_Tests.cfg

[db]
prepare=mkdir db
clean=rm -rf db
program=mongod --config mongod.conf
setup=create_test_subscribers.sh
copy=mongod.conf
make=no
package=no

[udm]
prepare=./open5gs_prepare.sh
program=open5gs-udmd -c open5gs-udm.yaml
make=open5gs
package=open5gs-udm
copy=open5gs-udm.yaml open5gs_prepare.sh

