# See https://github.com/open5gs/open5gs/blob/main/configs/open5gs/sepp1.yaml.in

logger:
  level: trace

global:
  max:
    ue: 1024

sepp:
  default:
#    tls:
#      server:
#        private_key: @sysconfdir@/open5gs/tls/sepp1.key
#        cert: @sysconfdir@/open5gs/tls/sepp1.crt
#      client:
#        cacert: @sysconfdir@/open5gs/tls/ca.crt
  sbi:
    server:
      - address: 127.0.1.250
        port: 7777
    client:
#      nrf:
#        - uri: http://127.0.0.10:7777
      scp:
        - uri: http://127.0.0.200:7777
  n32:
    server:
      - sender: sepp1.localdomain
        scheme: http #s
        address: 127.0.1.251
        port: 7777
        n32f:
          scheme: http #s
          address: 127.0.0.252
          port: 7777
    client:
      sepp:
        - receiver: sepp2.localdomain
          scheme: http #s
          uri: http://sepp2.localdomain:7777
          resolve: 127.0.0.10
          n32f:
            scheme: http #s
            uri: http://sepp2.localdomain:7777
            resolve: 127.0.0.10
