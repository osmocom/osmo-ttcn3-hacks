[testsuite]
program=SGSN_Tests
config=SGSN_Tests.cfg

[stp]
program=osmo-stp
make=libosmo-sigtran
package=osmo-stp
copy=osmo-stp.cfg

[sgsn]
program=osmo-sgsn
make=osmo-sgsn
package=osmo-sgsn
copy=osmo-sgsn.cfg
vty_port=4245
vty_host=127.0.0.10
# remove once osmo-sgsn >= 1.14.0 is released
prepare_latest=sed -i '/^  gummei.*/d' osmo-sgsn.cfg
